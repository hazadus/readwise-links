name: ☁️ Публикация скитов

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # В 07:00 UTC каждый день

permissions:
  contents: write

jobs:
  publish-skeets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-groups --link-mode=copy;

      - name: Run skeet script
        run: |
          uv run ./app/skeet.py hazadus.bsky.social "${{ secrets.BSKY_PASSWORD }}"

      - name: Commit and push
        run: |-
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add ./data/skeets.json
          timestamp=$(date -u)
          git commit -m "Новые скиты от ${timestamp}" || exit 0
          git pull --rebase
          git push
